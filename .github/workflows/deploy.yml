name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Refresh WSDOT data about every 10 minutes. Odd minutes avoid GitHub's busy top of the hour.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

# No default token permissions; each job asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch WSDOT snapshot
        # The secret is exposed to this step only. The script never logs request URLs and
        # refuses to write output containing the code. With no secret, it publishes an
        # "unavailable" snapshot and the deploy continues.
        env:
          WSDOT_ACCESS_CODE: ${{ secrets.WSDOT_ACCESS_CODE }}
        run: node scripts/fetch-wsdot.ts
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
