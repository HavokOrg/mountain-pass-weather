name: Keep schedule alive

# GitHub disables scheduled workflows in public repos after 60 days without repository
# activity. Re-enabling a workflow through the API resets that timer, so this monthly job
# keeps the WSDOT refresh running without making commits.
on:
  schedule:
    - cron: '17 6 1 * *' # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for workflow in deploy.yml keepalive.yml; do
            gh api --method PUT "repos/$REPO/actions/workflows/$workflow/enable"
            echo "re-enabled $workflow"
          done
